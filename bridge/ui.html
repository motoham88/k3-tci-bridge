<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>K3 Remote</title>
<style>
:root{
  --bg:#12151a; --panel:#1a1f27; --panel2:#222834; --line:#2e3644;
  --ink:#e6ebf2; --dim:#8b97a8; --accent:#4ea3ff; --on:#33d17a;
  --warn:#f5a524; --off:#e0413e; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--ink); font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  padding:10px; display:flex; flex-direction:column; gap:10px;
  max-width:760px; margin:0 auto; -webkit-user-select:none; user-select:none;
}
.panel{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px}
.row{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.spacer{flex:1}
h1{font-size:14px; margin:0; font-weight:600; letter-spacing:.02em}
.sub{color:var(--dim); font-size:12px}

/* status */
#dot{width:9px;height:9px;border-radius:50%;background:var(--off);flex:none}
#dot.on{background:var(--on)} #dot.wait{background:var(--warn)}

/* frequency: click upper/lower half of a digit to step that decade */
#freq{display:flex; justify-content:center; gap:1px; font-family:var(--mono);
  font-size:clamp(30px,10vw,54px); font-weight:600; letter-spacing:.02em; padding:2px 0}
.d{position:relative; padding:2px 1px; border-radius:4px; cursor:ns-resize; min-width:.62em; text-align:center}
.d:hover{background:var(--panel2)}
.d.sep{cursor:default; color:var(--dim); min-width:.34em}
.d.sep:hover{background:none}
.d .hit{position:absolute;left:0;right:0;height:50%}
.d .up{top:0} .d .dn{bottom:0}
.d.lead{color:#4a5364}
#vfob{font-family:var(--mono); color:var(--dim); font-size:13px; text-align:center}

/* tuning wheel: drag right to tune up. The ticks are a repeating gradient
   whose offset follows the drag, so the strip reads as a knob turning
   rather than a slider being dragged to a position -- it has no ends. */
#wheel{
  position:relative; height:46px; margin-top:10px; border-radius:8px;
  border:1px solid var(--line); background-color:var(--panel2);
  /* pan-y, not none: a vertical swipe that happens to start on the strip
     is the operator scrolling the page, and swallowing it both refuses the
     scroll and tunes the radio on the gesture's horizontal wobble. */
  cursor:ew-resize; touch-action:pan-y; overflow:hidden;
}
#ticks{
  position:absolute; inset:0;
  background-image:repeating-linear-gradient(90deg,
    var(--dim) 0 1px, transparent 1px 12px);
  opacity:.55;
}
/* Fake the curvature of a real knob: the face darkens towards both edges,
   which is what stops it reading as a flat ruler. */
#wheel::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(90deg, var(--panel) 0, transparent 18%,
    transparent 82%, var(--panel) 100%);
}
#wheel .mark{
  position:absolute; top:6px; bottom:6px; left:50%; width:2px;
  margin-left:-1px; background:var(--accent); border-radius:1px;
}
#wheel.live{border-color:var(--accent)}
/* LOCK: the radio's lock does not stop CAT (measured), so the page stops
   itself, and shows that it has. */
.locked #freq, .locked #wheel, .locked #wrate, .locked .steps, .locked #bands, .locked #vforow{
  opacity:.4; cursor:not-allowed}
#wheel.live #ticks{opacity:.9}
#wrate{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:6px}
#wrate button{padding:7px 4px; font-size:12px; font-family:var(--mono)}
#vforow{display:grid; grid-template-columns:1fr 1fr 2fr 1fr; gap:6px; margin-top:6px}
/* One box holding a label and the entry, so it reads as a single field. */
#fwrap{display:flex; align-items:center; gap:6px; min-width:0; cursor:text;
  background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:0 8px}
#fwrap:focus-within{border-color:var(--accent)}
#fwrap.bad{border-color:var(--off)}
#fwrap .lbl{white-space:nowrap; font-size:10px}
#fent{flex:1; min-width:0; background:none; border:0; outline:0; padding:0;
  color:var(--ink); font-family:var(--mono); font-size:15px}
/* Held, not tapped: no long-press menu or text selection under the finger. */
#rev{touch-action:none; -webkit-touch-callout:none}
#bands{display:grid; grid-template-columns:repeat(6,1fr); gap:6px; margin-top:6px}
#bands button{padding:7px 0; font-size:12px; font-family:var(--mono)}

/* decoded text */
#decode{
  font-family:var(--mono); font-size:14px; line-height:1.5; height:92px;
  overflow-y:auto; white-space:pre-wrap; word-break:break-word;
  background:var(--panel2); border:1px solid var(--line); border-radius:8px;
  padding:8px; color:var(--ink); -webkit-user-select:text; user-select:text;
}
#decode.idle{color:var(--dim)}

/* buttons */
button{
  background:var(--panel2); color:var(--ink); border:1px solid var(--line);
  border-radius:8px; padding:9px 11px; font-size:13px; font-family:inherit;
  cursor:pointer; touch-action:manipulation;
}
button:hover{border-color:#3f4a5c}
button.on{background:var(--accent); border-color:var(--accent); color:#06121f; font-weight:600}
button:disabled{opacity:.45; cursor:not-allowed}
.modes{display:grid; grid-template-columns:repeat(4,1fr); gap:6px}
.steps{display:grid; grid-template-columns:repeat(5,1fr); gap:6px}
#ritrow{display:grid; grid-template-columns:1fr 1fr .8fr 1.2fr .8fr 1fr; gap:6px; margin-top:8px}
#ritoff{font-family:var(--mono); font-size:13px; text-align:center; align-self:center}
#nbhint{color:var(--warn); font-size:12px; margin-top:4px}

/* meter */
#meter,#txmeter{height:20px; background:var(--panel2); border-radius:5px; overflow:hidden; position:relative}
#txbar{height:100%; width:0; background:linear-gradient(90deg,var(--on),#c9d635 70%,var(--off));
  transition:width .08s linear}
#alcmeter{height:16px; background:var(--panel2); border-radius:5px; overflow:hidden}
/* The K3 is not a radio where any ALC is bad. Elecraft designs its ALC as
   a levelling control with a TARGET range -- around 4-5 of the 7 segments
   is correct drive, not overdrive. Under-driving reads as a warning here
   just as over-driving does. */
#alcbar{height:100%; width:0; transition:width .08s linear; background:var(--on)}
#alcbar.low{background:var(--accent)} #alcbar.hot{background:var(--off)}
#alcscale{display:flex; justify-content:space-between; color:var(--dim);
  font-size:10px; font-family:var(--mono); margin-top:3px}
#txpanel{opacity:.45; transition:opacity .15s}
#txpanel.live{opacity:1}
#bar{height:100%; width:0; background:linear-gradient(90deg,var(--on),#c9d635 62%,var(--off));
  transition:width .09s linear}
#scale{display:flex; justify-content:space-between; color:var(--dim); font-size:10px;
  font-family:var(--mono); margin-top:3px}
#sval{font-family:var(--mono); font-size:13px; min-width:8.5em; text-align:right}

/* ptt */
#ptt{width:100%; padding:20px; font-size:19px; font-weight:700; letter-spacing:.06em;
  background:#2b1d1d; border-color:#5a2b2b; color:#ffb4b0}
#ptt.tx{background:var(--off); border-color:var(--off); color:#fff}
input[type=range]{width:100%; accent-color:var(--accent)}
#log{font-family:var(--mono); font-size:11px; color:var(--dim); height:76px;
  overflow-y:auto; white-space:pre-wrap; line-height:1.35}
.lbl{font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.06em}
</style>
</head>
<body>

<div class="panel row">
  <span id="dot"></span>
  <h1 id="dev">connecting…</h1>
  <span class="spacer"></span>
  <span class="sub" id="host"></span>
</div>

<div class="panel">
  <div class="row"><span class="lbl">S-meter</span><span class="spacer"></span><span id="sval">—</span></div>
  <div id="meter"><div id="bar"></div></div>
  <div id="scale"><span>S1</span><span>S3</span><span>S5</span><span>S7</span><span>S9</span><span>+20</span><span>+40</span><span>+60</span></div>
</div>

<div class="panel" id="freqpanel">
  <div id="freq"></div>
  <div id="vfob">B  —</div>
  <div class="steps" style="margin-top:8px">
    <button data-step="-1000">−1k</button>
    <button data-step="-100">−100</button>
    <button data-step="100">+100</button>
    <button data-step="1000">+1k</button>
    <button id="ab">A⇄B</button>
  </div>
  <div id="vforow">
    <button id="abcopy" title="Copy VFO A to VFO B, as A&gt;B does on the radio">A&gt;B</button>
    <button id="rev" title="Hold to listen on VFO B">REV</button>
    <label id="fwrap"><span class="lbl">Freq Entry</span>
      <input id="fent" inputmode="decimal" autocomplete="off" placeholder="7.030"></label>
    <button id="fgo">Go</button>
  </div>
  <div id="wheel"><div id="ticks"></div><div class="mark"></div></div>
  <div id="wrate"></div>
  <div id="bands"></div>
</div>

<div class="panel">
  <div class="lbl" style="margin-bottom:6px">Mode</div>
  <div class="modes" id="modes"></div>
  <div class="lbl" style="margin:10px 0 6px">Filter <span id="bwnow" class="sub"></span></div>
  <div class="steps" id="filters"></div>
  <div class="row" style="margin-top:8px">
    <span class="lbl" style="min-width:3.2em">Width</span>
    <input type="range" id="bw" min="50" max="2800" step="50" value="400" style="flex:1;width:auto">
    <span class="sub" id="bwv" style="min-width:3.5em;text-align:right">—</span>
  </div>
  <div class="row" style="margin-top:8px">
    <span class="lbl" style="min-width:3.2em">Shift</span>
    <input type="range" id="shift" min="100" max="1050" step="10" value="590" style="flex:1;width:auto">
    <span class="sub" id="shiftv" style="min-width:3.5em;text-align:right">—</span>
    <button id="shiftnorm" style="padding:5px 9px;font-size:12px" title="Re-centre the passband, as NORM does on the radio">NORM</button>
  </div>
  <div class="row" style="margin-top:8px">
    <button id="split">SPLIT</button>
    <button id="agc" title="AGC fast/slow">AGC</button>
    <button id="lock" title="VFO A lock">LOCK</button>
    <span class="spacer"></span>
    <span class="sub" id="ifinfo"></span>
  </div>
  <div class="lbl" style="margin:10px 0 6px">Receive</div>
  <div class="steps" style="grid-template-columns:repeat(4,1fr)">
    <button id="pre">PRE</button>
    <button id="att">ATT</button>
    <button id="nb">NB</button>
    <button id="nr" title="Presses NR on the radio">NR</button>
    <button id="ntch" title="Presses NTCH on the radio, which cycles it">NTCH</button>
    <button id="xfil" title="Presses XFIL on the radio: next crystal filter">XFIL</button>
    <button id="rxant" title="Receive on the RX ANT input">RX ANT</button>
  </div>
  <div id="nbhint"></div>
  <div class="row" style="margin-top:8px">
    <span class="lbl" style="min-width:3.2em">SQL</span>
    <input type="range" id="sql" min="0" max="29" value="0" style="flex:1;width:auto">
    <span class="sub" id="sqlv" style="min-width:3.5em;text-align:right">open</span>
  </div>
  <div id="ritrow">
    <button id="rit">RIT</button>
    <button id="xit">XIT</button>
    <button data-rit="-50">−50</button>
    <span id="ritoff">+0 Hz</span>
    <button data-rit="50">+50</button>
    <button id="ritclr">CLR</button>
  </div>
</div>

<div class="panel" id="decodepanel">
  <div class="row">
    <span class="lbl">Decoded text</span>
    <span class="spacer"></span>
    <button id="declear" style="padding:5px 9px;font-size:12px">Clear</button>
  </div>
  <div id="decode" class="idle" style="margin-top:8px"></div>
  <div class="sub" id="dechint" style="margin-top:6px"></div>
</div>

<div class="panel" id="cwpanel">
  <div class="row">
    <span class="lbl">CW</span>
    <span class="sub" id="cwhint"></span>
    <span class="spacer"></span>
    <span class="lbl">WPM</span>
    <input type="number" id="wpm" min="8" max="50" value="20"
           style="width:4.2em;background:var(--panel2);color:var(--ink);
                  border:1px solid var(--line);border-radius:6px;padding:6px">
  </div>
  <div class="row" style="margin-top:8px">
    <input type="text" id="cwtext" placeholder="type, Enter to send" autocomplete="off"
           style="flex:1;min-width:10em;background:var(--panel2);color:var(--ink);
                  border:1px solid var(--line);border-radius:8px;padding:10px;
                  font-family:var(--mono);font-size:15px">
    <button id="cwsend">Send</button>
    <button id="cwstop">Stop</button>
  </div>
  <div class="steps" id="cwmacros" style="margin-top:8px;grid-template-columns:repeat(4,1fr)"></div>
  <div class="row" style="margin-top:8px">
    <span class="lbl">Call</span>
    <input type="text" id="mycall" placeholder="your call" autocomplete="off"
           style="width:7em;background:var(--panel2);color:var(--ink);
                  border:1px solid var(--line);border-radius:6px;padding:6px;
                  font-family:var(--mono);text-transform:uppercase">
    <span class="lbl">His</span>
    <input type="text" id="hiscall" placeholder="worked" autocomplete="off"
           style="width:7em;background:var(--panel2);color:var(--ink);
                  border:1px solid var(--line);border-radius:6px;padding:6px;
                  font-family:var(--mono);text-transform:uppercase">
  </div>
</div>

<div class="panel">
  <div class="row">
    <button id="audio">▶ Audio</button>
    <span class="sub" id="astat">off</span>
    <span class="spacer"></span>
    <span class="sub" id="lat"></span>
  </div>
  <div class="row" style="margin-top:8px">
    <span class="lbl" style="min-width:3.2em">Pwr</span>
    <input type="range" id="pwr" min="0" max="100" value="5">
    <span class="sub" id="pwrw" style="min-width:3.5em;text-align:right">5 W</span>
    <button id="tune">TUNE</button>
  </div>
  <div class="sub" id="pwrwarn" style="color:var(--warn);margin-top:4px" hidden></div>
  <div class="row" style="margin-top:8px">
    <span class="lbl" style="min-width:3.2em">Mon</span>
    <input type="range" id="mon" min="0" max="100" value="0">
    <span class="sub" id="monv" style="min-width:3.5em;text-align:right">0</span>
  </div>
  <div class="row" style="margin-top:8px">
    <span class="lbl" style="min-width:3.2em">Vol</span>
    <input type="range" id="vol" min="-60" max="0" value="-10">
    <span class="sub" id="voldb" style="min-width:3.5em;text-align:right">−10 dB</span>
  </div>
</div>

<div class="panel" id="txpanel">
  <div class="row">
    <span class="lbl">TX audio</span>
    <span class="spacer"></span>
    <span class="sub" id="txstat">idle</span>
  </div>
  <div id="txmeter"><div id="txbar"></div></div>
  <div class="row" style="margin-top:10px">
    <span class="lbl">ALC</span>
    <span class="spacer"></span>
    <span class="sub" id="alcval">—</span>
  </div>
  <div id="alcmeter"><div id="alcbar"></div></div>
  <div id="alcscale">
    <span>0</span><span>1</span><span>2</span><span>3</span>
    <span>4</span><span>5</span><span>6</span><span>7</span>
  </div>
  <div class="sub" id="alchint" style="margin-top:6px"></div>
</div>

<button id="ptt">PTT — HOLD</button>

<div class="panel"><div id="log"></div></div>

<script>
"use strict";
// ── connection ────────────────────────────────────────────────────────────
// Same host and port the page came from, so the page origin and the socket
// always agree. Serving over plain http is deliberate: a browser refuses a
// ws:// socket from an https:// page, and the bridge speaks ws://.
const HOST = location.host || "192.168.1.198:50001";
const S = { mode:"", vfoA:0, vfoB:0, split:false, agc:"",
            pre:false, att:false, nb:false, nbLevels:[0,0], nr:false, notch:"off",
            rit:false, xit:false, ritOffset:0,
            sqlOn:false, sqlLevel:0, lock:false, xfil:0, rxAnt:false, tx:false, audio:false,
            ready:false, flo:0, fhi:0, txLevel:0, txSeen:0,
            decoded:false, meterSeen:0, msgSeen:0, askedAudio:0 };
const $ = s => document.querySelector(s);
let ws, ctx, gain, nextT = 0, frames = 0, lastFrame = 0;

$("#host").textContent = HOST;

function log(m){
  const el = $("#log");
  const t = new Date().toTimeString().slice(0,8);
  el.textContent += `${t}  ${m}\n`;
  el.scrollTop = el.scrollHeight;
}
function send(c){ if (ws && ws.readyState === 1) ws.send(c.endsWith(";") ? c : c + ";"); }

function connect(){
  ws = new WebSocket(`ws://${HOST}`);
  ws.binaryType = "arraybuffer";
  $("#dot").className = "wait";
  ws.onopen  = () => log("socket open");
  ws.onclose = () => { $("#dot").className=""; $("#dev").textContent="disconnected";
                       S.ready=false; log("closed — retrying in 2 s"); setTimeout(connect, 2000); };
  ws.onerror = () => log("socket error");
  ws.onmessage = e => {
    S.msgSeen = performance.now();
    if (typeof e.data === "string") e.data.split(";").forEach(t => t.trim() && onText(t.trim()));
    else onAudio(e.data);
  };
}

// ── text protocol ─────────────────────────────────────────────────────────
function onText(msg){
  const i = msg.indexOf(":");
  const name = (i < 0 ? msg : msg.slice(0,i)).toLowerCase();
  const args = i < 0 ? [] : msg.slice(i+1).split(",");

  switch(name){
    case "device":  $("#dev").textContent = args[0] || "TCI"; break;
    case "ready":
      S.ready = true; $("#dot").className = "on"; log("ready");
      // A SUBSCRIPTION DOES NOT SURVIVE THE SOCKET. audio_start registers
      // this connection with the bridge, so a reconnect -- a Wi-Fi hiccup,
      // a bridge restart, a keepalive timeout -- leaves the page believing
      // audio is on, the button still reading "Audio", the context still
      // running, and nothing ever arriving again. The dot goes green and
      // the radio goes quiet, which is exactly what it looked like from
      // the operating position. So the subscription is re-asserted here,
      // where the bridge has just said it is ready to take commands.
      if (S.audio){ nextT = 0; resumeCtx();
                    send("audio_start:0"); send(`volume:${$("#vol").value}`);
                    log("audio re-subscribed"); }
      break;
    case "start":   break;
    case "vfo":
      // While we are stepping, read-backs arrive behind the operator --
      // the bridge is answering a frequency already tuned past, and applying
      // it would drag the display backwards. They are dropped for as long as
      // the hold lasts, and holdFreq's own GET resyncs afterwards; because
      // the bridge handles commands in order, that GET reports whatever the
      // last SET actually settled on, band-edge clamp included.
      //
      // The hold covers the digit steppers and the +/-100/1k buttons too,
      // not just the wheel. A reconcile sweep or an unsolicited IF lands
      // every 3 s regardless of what the operator is doing, and one that
      // arrives in the 120 ms between a step and its read-back repaints the
      // display with the frequency from BEFORE the step.
      if (args[1] === "0"){ if (performance.now() < freqHold) break;
                            S.vfoA = +args[2]; drawFreq(); }
      else if (args[1] === "1"){ S.vfoB = +args[2]; $("#vfob").textContent = "B  " + fmt(S.vfoB); }
      break;
    case "rx_text":
      // The bridge's own message; TCI has none for decoded text. The payload
      // is percent-encoded because ';' and ',' are legal in decoded RTTY and
      // PSK and would otherwise be read as framing -- note that the socket
      // handler above splits on ';' before this function ever sees a message.
      appendDecode(unescapeText(args.slice(1).join(","))); break;
    case "modulation":
      // The bridge may use any case; normalise like other TCI clients do.
      S.mode = (args[1]||"").toUpperCase(); paintModes(); paintFilters(); paintCw(); break;
    case "rx_filter_band":
      S.flo = +args[1]; S.fhi = +args[2]; paintFilters(); break;
    case "band_plan":
      // The bridge's own message: name/low/high for every band the radio
      // has, lowest first. The table lives in tci.py alone.
      PLAN = args.map(a => { const [name, lo, hi] = a.split("/");
                             return { name, lo:+lo, hi:+hi }; });
      buildBands(); break;
    case "agc_mode":
      // Lit for fast, the way the radio's display flags AGC-F.
      S.agc = (args[1]||"").toLowerCase();
      $("#agc").textContent = S.agc === "fast" ? "AGC-F" : S.agc === "slow" ? "AGC-S" : "AGC";
      $("#agc").classList.toggle("on", S.agc === "fast"); break;
    case "preamp":      S.pre = args[1] === "true"; paintRx(); break;
    case "attenuator":  S.att = args[1] === "true"; paintRx(); break;
    case "rx_nb_enable": S.nb = args[1] === "true"; paintRx(); break;
    case "rx_nr_enable": S.nr = args[1] === "true"; paintRx(); break;
    case "rx_ant":      S.rxAnt = args[1] === "true"; paintRx(); break;
    case "if_shift":    S.ifc = +args[1] || 0; paintShift(); break;
    case "xfil":        S.xfil = +args[1] || 0; S.xfilHz = +args[2] || 0; paintRx(); break;
    case "notch":       S.notch = args[1] || "off"; paintRx(); break;
    case "nb_levels":   S.nbLevels = [+args[1] || 0, +args[2] || 0]; paintRx(); break;
    case "sql_enable":  S.sqlOn = args[1] === "true"; paintSql(); break;
    case "sql_level":   S.sqlLevel = +args[1] || 0; paintSql(); break;
    case "lock":        S.lock = args[1] === "true"; paintLock(); break;
    case "rit_enable":  S.rit = args[1] === "true"; paintRit(); break;
    case "xit_enable":  S.xit = args[1] === "true"; paintRit(); break;
    case "rit_offset":  S.ritOffset = +args[1] || 0; paintRit(); break;
    case "split_enable":
      S.split = args[1] === "true"; $("#split").classList.toggle("on", S.split); break;
    case "trx":
      S.tx = args[1] === "true"; paintPtt(); break;
    case "rx_smeter":
      S.meterSeen = performance.now(); setMeter(+args[1]); break;
    case "tx_sensors": {
      // mic field is the level of the TX audio the bridge is actually
      // receiving from a client and feeding to the radio. Zero while
      // transmitting means the client is keying but sending nothing.
      const lvl = +args[1] || 0, pk = +args[3] || 0;
      const swr = +args[4] || 0, alc = +args[5] || 0;
      // ALC is 0-7 on the K3 and only meaningful with METER on CMP/ALC.
      const bar = $("#alcbar");
      bar.style.width = Math.max(0, Math.min(100, alc / 7 * 100)) + "%";
      bar.className = alc >= 7 ? "hot" : alc <= 2 ? "low" : "";
      // ALC is not reported: polling the radio for it during transmit
      // made the K3 drop out of TX. Left in place, showing why.
      $("#alcval").textContent = S.tx ? "read it on the radio" : "—";
      // Target for the K3 is roughly 4-5 of 7 -- its ALC levels rather
      // than merely limits, so too little is as wrong as too much.
      $("#alchint").textContent = !S.tx ? ""
        : "ALC unavailable remotely — polling it during TX drops the "
          + "transmitter. Target on the K3 is about 4-5 bars.";
      $("#txbar").style.width = Math.max(0, Math.min(100, lvl)) + "%";
      S.txLevel = lvl; S.txSeen = performance.now();
      $("#txstat").textContent = S.tx
        ? (lvl > 0.5 ? `${lvl.toFixed(0)}%  peak ${pk.toFixed(0)}%`
                     : "KEYED BUT NO AUDIO")
        : "idle";
      break;
    }
    case "mon_volume":
      if (!isNaN(+args[0])) { $("#mon").value = +args[0]; $("#monv").textContent = +args[0]; }
      break;
    case "mon_enable": break;
    case "drive":
      if (!isNaN(+args[1])) { $("#pwr").value = +args[1]; showPwr(+args[1]); }
      break;
    case "tune": break;
    case "cw_keyer_speed":
      if (!isNaN(+args[0])) $("#wpm").value = +args[0]; break;
    case "volume":
      if (!isNaN(+args[0])) { $("#vol").value = +args[0]; $("#voldb").textContent = (+args[0]) + " dB"; }
      break;
    case "protocol": case "receive_only": case "trx_count": case "channels_count":
    case "vfo_limits": case "if_limits": case "modulations_list": case "iq_samplerate":
    case "audio_samplerate": case "rx_enable": case "mic_level":
    case "xit_offset": case "mute": case "dds": case "split":
    case "cw_macros_speed": case "audio_start": case "audio_stop":
    case "tx_profiles_ex": case "tx_profile_ex": case "audio_stream_sample_type":
    case "audio_stream_channels": case "audio_stream_samples":
      break;                                   // known, nothing to show
    default: log("? " + msg);
  }
}

// ── frequency display: click or wheel a digit to step that decade ─────────
function fmt(hz){
  const s = String(Math.max(0, Math.round(hz))).padStart(9,"0");
  return `${(+s.slice(0,-6))}.${s.slice(-6,-3)}.${s.slice(-3)}`;
}
function drawFreq(){
  const s = String(Math.max(0, Math.round(S.vfoA))).padStart(9,"0");
  const el = $("#freq"); el.innerHTML = "";
  let lead = true;
  for (let i = 0; i < s.length; i++){
    const decade = s.length - 1 - i;            // 10^decade for this column
    if (i === 3 || i === 6){
      const sep = document.createElement("span");
      sep.className = "d sep"; sep.textContent = "."; el.appendChild(sep);
    }
    if (s[i] !== "0") lead = false;
    const d = document.createElement("span");
    d.className = "d" + (lead && decade > 5 ? " lead" : "");
    d.textContent = s[i];
    const up = document.createElement("span"); up.className = "hit up";
    const dn = document.createElement("span"); dn.className = "hit dn";
    // The MHz digit steps band to band instead: one MHz up from 7.050 is
    // 8.050, which the radio files as the 40 m memory and recalls there
    // ever after. Every other digit, the strip and the buttons tune freely,
    // which is how general coverage (WWV, broadcast) stays reachable.
    const by = decade === 6 ? bandStep : dir => step(dir * Math.pow(10, decade));
    up.onclick = e => { e.stopPropagation(); by(+1); };
    dn.onclick = e => { e.stopPropagation(); by(-1); };
    d.append(up, dn); el.appendChild(d);
  }
  paintBands();
}
// Every `vfo` SET costs the bridge a write, a 120 ms settle and a read-back
// with a 1 s timeout -- all under the lock that serialises EVERY client's
// commands, PTT included. So the send rate is not this page's own business,
// and a wheel drag can produce events far faster than a finger crosses
// pixels. Sends are throttled to one in flight plus one queued; each carries
// an absolute frequency, so the ones dropped in between lose nothing.
const VFO_MIN_MS = 120;
let vfoTimer = null, vfoQueued = false;
function sendVfo(){
  if (vfoTimer){ vfoQueued = true; return; }
  send(`vfo:0,0,${Math.round(S.vfoA)}`);
  vfoTimer = setTimeout(() => {
    vfoTimer = null;
    if (vfoQueued){ vfoQueued = false; sendVfo(); }
  }, VFO_MIN_MS);
}
// The display is painted optimistically, so between a step and the bridge's
// read-back it is AHEAD of the radio and every `vfo` message on the wire is
// behind it. Applying one drags the display backwards under the operator --
// which is what the drift looked like. So read-backs are ignored until the
// traffic settles, and one GET at the end resyncs; that GET is also what
// corrects the display when the radio clamps at a band edge.
//
// A continuing drag pushes the deadline out ahead of itself, so one timer
// serves a single button press and a thirty-second turn of the wheel alike.
// It cannot expire under a live drag, which is not the same thing: at 1 Hz
// a tick is 12 px of deliberate movement, so a slow turn can go longer than
// the deadline between steps, and letting it lapse there would resync from
// under the finger AND spend a GET on the lock that every client's commands
// -- PTT included -- go through. The drag holds until it ends.
const FREQ_SETTLE_MS = VFO_MIN_MS + 280;
let freqHold = 0, resyncTimer = null;
function holdFreq(){
  freqHold = performance.now() + FREQ_SETTLE_MS;
  clearTimeout(resyncTimer);
  resyncTimer = setTimeout(() => {
    if (engaged) return holdFreq();
    freqHold = 0; send("vfo:0,0");
  }, FREQ_SETTLE_MS);
}
function step(hz){
  if (S.lock) return;                           // see paintLock
  S.vfoA = Math.max(0, S.vfoA + hz);
  drawFreq();                                   // optimistic; the bridge
  holdFreq();                                   // echoes the accepted value
  sendVfo();
}
// ── bands ─────────────────────────────────────────────────────────────────
// The bridge does the work: it selects the band as the radio's BAND key
// would, recalling the last frequency used there, and replaces that with a
// default only if it is off-band. Where it lands is not known here, so
// nothing is painted ahead of it -- the broadcast repaints.
//
// One button per band in the bridge's plan, so the buttons cannot disagree
// with what the bridge will accept. Rebuilt on every init burst.
let PLAN = [];                                  // from band_plan
const bEl = $("#bands");
function buildBands(){
  bEl.innerHTML = "";
  PLAN.forEach(({ name }) => {
    const b = document.createElement("button");
    b.textContent = name; b.dataset.band = name;
    b.onclick = () => { if (!S.lock) send(`band:0,${name}`); };
    bEl.appendChild(b);
  });
  paintBands();
}
function bandOf(hz){ return PLAN.find(b => b.lo <= hz && hz <= b.hi); }
function paintBands(){
  const cur = bandOf(S.vfoA);
  if (cur && cur.name === bandPending) bandPending = null;   // arrived
  bEl.querySelectorAll("button").forEach(b =>
    b.classList.toggle("on", !!cur && b.dataset.band === cur.name));
}
// Next band up or down from wherever the VFO is, in or out of a band.
// Walks every band the radio has, not just the buttons, so 60/17/12/6 m
// stay one press away.
//
// A band change takes the bridge most of a second to report back, and a
// second press inside that would step from the band being LEFT -- two
// presses from 40 m would both ask for 30 m. So a press steps from the band
// last asked for until the VFO is seen to arrive, with a timer behind that
// in case the radio refuses (transmitting, say).
let bandPending = null, bandPendingTimer = null;
function bandStep(dir){
  if (S.lock) return;
  // An older bridge sends no plan; step a plain MHz rather than go dead.
  if (!PLAN.length) return step(dir * 1e6);
  const f = S.vfoA;
  let i = PLAN.findIndex(b => b.name === bandPending);
  if (i < 0) i = PLAN.findIndex(b => b.lo <= f && f <= b.hi);
  const next = i >= 0 ? PLAN[i + dir]
             : dir > 0 ? PLAN.find(b => b.lo > f)
             : PLAN.filter(b => b.hi < f).pop();
  if (!next) return;
  bandPending = next.name;
  clearTimeout(bandPendingTimer);
  bandPendingTimer = setTimeout(() => { bandPending = null; }, 2000);
  send(`band:0,${next.name}`);
}

// ── tuning wheel ──────────────────────────────────────────────────────────
// Complements the digit stepping rather than replacing it: the digits are
// exact and the wheel is fast, and they are wanted at different moments.
//
// The strip has no ends and no position -- only motion. Dragging right tunes
// up, the ticks slide with the drag, and releasing does not spring back,
// which is how a knob behaves and how a slider does not.
const WHEEL_RATES = [1, 10, 100, 1000];
const PX_PER_TICK = 12;                 // must match the CSS tick gradient
let wheelStep = 10, tickAcc = 0, tickOffset = 0;

const wrate = $("#wrate");
WHEEL_RATES.forEach(hz => {
  const b = document.createElement("button");
  b.textContent = hz >= 1000 ? (hz / 1000) + " k" : hz + " Hz";
  b.dataset.hz = hz;
  b.onclick = () => { wheelStep = hz; paintRates(); };
  wrate.appendChild(b);
});
function paintRates(){
  [...wrate.children].forEach(b =>
    b.classList.toggle("on", +b.dataset.hz === wheelStep));
}
paintRates();

const wheel = $("#wheel"), ticksEl = $("#ticks");
// A drag is not a turn until it is plainly horizontal. A finger that comes
// down here on the way to scrolling the page would otherwise tune the radio
// on its sideways wobble before the browser claims the gesture for the
// scroll -- a few hundred Hz, unasked for, with nothing on screen to say
// where it came from.
const ENGAGE_PX = 6;
let dragId = null, lastX = 0, startX = 0, startY = 0, engaged = false;

function turn(dx){
  tickOffset += dx;
  ticksEl.style.backgroundPositionX = tickOffset + "px";
  // Accumulate pixels and spend them a whole tick at a time, so slow
  // movement still resolves to exact multiples of the selected step
  // instead of drifting by fractions of one.
  tickAcc += dx;
  const n = Math.trunc(tickAcc / PX_PER_TICK);
  if (n){ tickAcc -= n * PX_PER_TICK; step(n * wheelStep); }
}

wheel.addEventListener("pointerdown", e => {
  if (dragId !== null) return;
  // Nothing is captured and nothing lights up yet: this may still turn out
  // to be a page scroll, and taking the pointer now would stop it being one.
  dragId = e.pointerId; startX = lastX = e.clientX; startY = e.clientY;
  engaged = false; tickAcc = 0;
});
wheel.addEventListener("pointermove", e => {
  if (e.pointerId !== dragId) return;
  if (!engaged){
    const dx = e.clientX - startX, dy = e.clientY - startY;
    // Mostly vertical: leave it alone. touch-action:pan-y means the browser
    // takes the gesture for the page and sends us a pointercancel.
    if (Math.abs(dy) >= Math.abs(dx) || Math.abs(dx) < ENGAGE_PX) return;
    engaged = true;
    wheel.setPointerCapture(dragId);
    wheel.classList.add("live");
    lastX = e.clientX;                 // turn from here, not from the deadzone
  }
  const dx = e.clientX - lastX;
  lastX = e.clientX;
  turn(dx);
});
function endDrag(e){
  if (e.pointerId !== dragId) return;
  dragId = null; engaged = false;
  wheel.classList.remove("live");
  // No resync of its own: the last step's hold already schedules one, far
  // enough out for the send that may still be queued to go first. The GET
  // queues behind it at the bridge, which handles commands in order.
}
wheel.addEventListener("pointerup", endDrag);
wheel.addEventListener("pointercancel", endDrag);

// ── decoded text ──────────────────────────────────────────────────────────
const dec = $("#decode");
const DEC_MAX = 4000;                   // characters kept in the panel
function unescapeText(t){
  try { return decodeURIComponent(t); }
  catch (err){ return t; }              // never let a bad escape stop decode
}
function appendDecode(text){
  if (!text) return;
  if (!S.decoded){ S.decoded = true; dec.classList.remove("idle");
                   dec.textContent = ""; $("#dechint").textContent = ""; }
  // Follow the tail only if the operator is already at it. Yanking the view
  // back down while they are reading something further up is worse than
  // letting the display lag behind the band.
  const atEnd = dec.scrollHeight - dec.scrollTop - dec.clientHeight < 24;
  dec.textContent = (dec.textContent + text).slice(-DEC_MAX);
  if (atEnd) dec.scrollTop = dec.scrollHeight;
}
function decodeIdle(){
  // `TB000;` is what the radio returns with text decode switched OFF, and
  // it is exactly what it returns with text decode on and nobody calling.
  // Nothing in CAT separates the two, so the panel says so rather than
  // sitting empty and looking broken.
  S.decoded = false;
  dec.classList.add("idle");
  dec.textContent = "waiting for decoded text…";
  $("#dechint").textContent =
    "Text decode is a front-panel setting with no CAT command: on the radio,"
    + " hold TEXT DEC and select CW 5-40 with VFO B. A quiet band looks the"
    + " same from here.";
}
decodeIdle();
$("#declear").onclick = decodeIdle;

document.querySelectorAll("[data-step]").forEach(b =>
  b.onclick = () => step(+b.dataset.step));
// ── A>B, REV, frequency entry ─────────────────────────────────────────────
$("#abcopy").onclick = () => { if (!S.lock) send("ab_copy:0"); };

// REV, held. The radio's own REV (SWT12) changes nothing CAT can see, so
// its state could not be shown here (measured; see tci._cmd_ab_copy). This
// does what REV is for instead: while held, A and B swap, so you listen on
// B; on release they swap back to exactly what they were. Frequencies
// only -- modes stay put, which is right for same-mode split work.
let revHeld = null;                             // [a, b] while held
function revDown(e){
  if (revHeld || S.lock || S.tx || !S.vfoB) return;
  e.preventDefault();
  try { $("#rev").setPointerCapture(e.pointerId); } catch (err) {}
  revHeld = [S.vfoA, S.vfoB];
  send(`vfo:0,0,${revHeld[1]}`); send(`vfo:0,1,${revHeld[0]}`);
  $("#rev").classList.add("on");
}
function revUp(){
  if (!revHeld) return;
  const [a, b] = revHeld; revHeld = null;
  send(`vfo:0,0,${a}`); send(`vfo:0,1,${b}`);
  $("#rev").classList.remove("on");
}
$("#rev").addEventListener("pointerdown", revDown);
["pointerup", "pointercancel", "lostpointercapture"].forEach(t =>
  $("#rev").addEventListener(t, revUp));
// A hold that outlives the page's attention must not leave A and B swapped.
window.addEventListener("blur", revUp);
document.addEventListener("visibilitychange", revUp);

// Typed frequency. With a point, under 100 is MHz ("7.030", "14.074") and
// anything larger is kHz; without one, under 100 is MHz ("7"), under
// 100000 is kHz ("7030", "14074"), and the rest is Hz. The radio's range
// (vfo_limits) bounds it; anything outside flags the box rather than
// sending.
function parseFreq(t){
  t = t.replace(/[\s,]/g, "");
  if (!/^\d+(\.\d*)?$/.test(t)) return null;
  const v = parseFloat(t);
  const hz = v < 100 ? v * 1e6 : (t.includes(".") || v < 100000) ? v * 1e3 : v;
  const r = Math.round(hz);
  return r >= 100000 && r <= 54000000 ? r : null;
}
function enterFreq(){
  const el = $("#fent"), hz = parseFreq(el.value);
  if (hz === null || S.lock){ $("#fwrap").classList.add("bad"); return; }
  $("#fwrap").classList.remove("bad"); el.value = ""; el.blur();
  S.vfoA = hz; drawFreq(); holdFreq(); sendVfo();
}
$("#fgo").onclick = enterFreq;
$("#fent").addEventListener("keydown", e => { if (e.key === "Enter") enterFreq(); });
$("#fent").addEventListener("input", () => $("#fwrap").classList.remove("bad"));

$("#ab").onclick = () => { if (S.lock) return; const a = S.vfoA; send(`vfo:0,0,${S.vfoB}`); send(`vfo:0,1,${a}`); };

// ── receive front end ─────────────────────────────────────────────────────
// All five light from what the radio reports, so a band change -- PRE, ATT

// NR and NTCH are presses rather than set-to-state: the radio has no

$("#pre").onclick = () => send(`preamp:0,${!S.pre}`);
$("#att").onclick = () => send(`attenuator:0,${!S.att}`);

// Squelch in the radio's own steps, 0-29, where 0 is open. The wire is

$("#sql").oninput = e => paintSqlValue(+e.target.value);
$("#sql").onchange = e => {

$("#lock").onclick = () => send(`lock:0,${!S.lock}`);
// The K3's lock holds its own knob only: a CAT frequency change goes through

// ── filter width ──────────────────────────────────────────────────────────
// The bridge takes carrier-relative edges. Where the passband sits relative
// to the carrier is mode-dependent: SSB is offset, CW/AM/FM straddle it.
const FILTERS = {
  ssb:[[300,2700,"2.7k"],[300,2400,"2.4k"],[300,1800,"1.8k"],[400,1200,"800"],[300,3600,"3.6k"]],
  // The station's crystals are 2.7k, 500 and 250 (tci.XFIL_WIDTHS); the
  // presets land on them, plus 400 and 100 for the DSP alone.
  cw: [[-1350,1350,"2.7k"],[-250,250,"500"],[-200,200,"400"],[-125,125,"250"],[-50,50,"100"]],
  am: [[-3000,3000,"6.0k"],[-2400,2400,"4.8k"],[-1500,1500,"3.0k"],[-1000,1000,"2.0k"],[-4000,4000,"8.0k"]],
};
function filterSet(){
  if (S.mode === "CWL" || S.mode === "CWU") return FILTERS.cw;
  if (S.mode === "AM" || S.mode === "NFM")  return FILTERS.am;
  return FILTERS.ssb;
}
function paintFilters(){
  const el = $("#filters"); el.innerHTML = "";
  const lsb = (S.mode === "LSB" || S.mode === "DIGL");
  for (const [lo, hi, label] of filterSet()){
    const b = document.createElement("button");
    b.textContent = label;
    // LSB/DIGL passbands live on the negative side of the carrier.
    const [a, z] = lsb && lo > 0 ? [-hi, -lo] : [lo, hi];
    b.classList.toggle("on", Math.abs((S.fhi - S.flo) - (z - a)) < 60);
    b.onclick = () => send(`rx_filter_band:0,${a},${z}`);
    el.appendChild(b);
  }
  const w = S.fhi - S.flo;
  $("#bwnow").textContent = w > 0 ? `${(w/1000).toFixed(w < 1000 ? 2 : 1)} kHz` : "";
  paintWidth();
  paintShift();
}

// ── SHIFT slider: the SHIFT knob ──────────────────────────────────────────
// The AF centre of the passband in Hz (the bridge's if_shift, i.e. IS),
// the figure the radio itself shows while SHIFT turns. Ranges are what the
// radio accepted (measured): CW 100-1050, with NORM at the PITCH; USB with
// a 2.4k filter 400-2600, NORM 1500 -- it clamps tighter as the filter
// widens, and the read-back puts the slider where it really landed. AM and
// FM straddle the carrier and were not measured, so SHIFT sits out there.
const SHIFT_RANGE = { cw:[100, 1050], ssb:[200, 2800] };
let shiftDragging = false;
function paintShift(){
  const el = $("#shift"), cw = filterSet() === FILTERS.cw;
  const off = filterSet() === FILTERS.am;
  el.disabled = off; $("#shiftnorm").disabled = off;
  const [lo, hi] = cw ? SHIFT_RANGE.cw : SHIFT_RANGE.ssb;
  el.min = lo; el.max = hi;
  if (shiftDragging) return;
  if (off){ $("#shiftv").textContent = "—"; return; }
  if (S.ifc > 0){ el.value = S.ifc; $("#shiftv").textContent = S.ifc + " Hz"; }
}
$("#shift").oninput = e => { shiftDragging = true; $("#shiftv").textContent = e.target.value + " Hz"; };
$("#shift").onchange = e => { shiftDragging = false; send(`if_shift:0,${e.target.value}`); };
$("#shiftnorm").onclick = () => send("if_shift:0,norm");

// ── width slider: the WIDTH knob ──────────────────────────────────────────
// Sets the DSP bandwidth (BW) and leaves the passband centre where it is,
// as the knob does; SHIFT is a separate control. The crystal is the
// radio's business -- it re-picks one to suit, which is why the XFIL
// button can change under a width change. Sends on release, like SQL.
const BW_MAX = { cw:2800, ssb:4000, am:5000 };
let bwDragging = false;
function widthRange(){
  return filterSet() === FILTERS.cw ? BW_MAX.cw
       : filterSet() === FILTERS.am ? BW_MAX.am : BW_MAX.ssb;
}
function fmtHz(w){ return w >= 1000 ? (w/1000).toFixed(2).replace(/0$/, "") + " kHz" : w + " Hz"; }
function paintWidth(){
  const el = $("#bw"); el.max = widthRange();
  if (bwDragging) return;                       // not under the finger
  const w = S.fhi - S.flo;
  if (w > 0){ el.value = w; $("#bwv").textContent = fmtHz(w); }
}
$("#bw").oninput = e => { bwDragging = true; $("#bwv").textContent = fmtHz(+e.target.value); };
$("#bw").onchange = e => {
  bwDragging = false;
  const w = +e.target.value;
  const sym = filterSet() !== FILTERS.ssb;      // CW, AM, FM: about the carrier
  const c = sym ? 0 : (S.flo + S.fhi) / 2;
  const lo = Math.round(c - w / 2);
  send(`rx_filter_band:0,${lo},${lo + w}`);
};

// ── S-meter ───────────────────────────────────────────────────────────────
// dBm → bar. S9 = -73 dBm, 6 dB per S-unit below it, so S1 = -121.
// The bridge's dBm figure is calibrated from SMH against a generator (see
// the command map): about 1 dB at 14 MHz, preamp and attenuator off.
// The bridge stops polling the S-meter during transmit -- SM reads 0000
// there and the reference warns against polling a transmitting radio -- so
// the last reading before the carrier went up is simply the last message
// that ever arrives. Nothing cleared the bar, so it SAT at that width for
// the whole over: key up on a loud station and the meter reads full scale
// until you unkey, saying nothing true about anything. Same for a bridge
// that has gone quiet. So the bar is cleared when it stops meaning
// something, rather than left showing the last thing it meant.
function clearMeter(why){
  $("#bar").style.width = "0";
  $("#sval").textContent = why;
}
function setMeter(dbm){
  if (isNaN(dbm)) return;
  if (S.tx) return;                             // not a signal: see above
  const pct = Math.max(0, Math.min(100, (dbm + 121) / (121 - 13) * 100));
  $("#bar").style.width = pct + "%";
  const over = dbm + 73;
  // Already a level at the antenna: the bridge takes the preamp and the
  // attenuator back out (tci.PRE_DB, tci.ATT_DB).
  $("#sval").textContent = over >= 0
    ? `S9+${Math.round(over)}  ${dbm} dBm`
    : `S${Math.max(0, Math.round(9 + over/6))}  ${dbm} dBm`;
}

// ── audio ─────────────────────────────────────────────────────────────────
// TCI RX frames: 64-byte header then interleaved float32 stereo at 48 kHz.
// Header words are little-endian uint32; word 6 is the frame type (1 = RX).
function onAudio(buf){
  if (!ctx || buf.byteLength <= 64) return;
  const h = new Uint32Array(buf, 0, 16);
  if (h[6] !== 1) return;                       // ignore IQ / TX_CHRONO
  const pcm = new Float32Array(buf, 64);
  const n = pcm.length >> 1;
  // 48000 is the rate of the DATA, not of the context, and is deliberately
  // not ctx.sampleRate. An AudioBuffer carries its own rate and the browser
  // resamples on playback when the two differ. Passing ctx.sampleRate would
  // relabel 48 kHz samples as whatever the hardware happens to run at and
  // play them at the wrong pitch.
  const ab = ctx.createBuffer(2, n, 48000);
  const L = ab.getChannelData(0), R = ab.getChannelData(1);
  for (let i = 0; i < n; i++){ L[i] = pcm[2*i]; R[i] = pcm[2*i+1]; }
  const src = ctx.createBufferSource();
  src.buffer = ab; src.connect(gain);
  const now = ctx.currentTime;
  // Small jitter buffer. If we have fallen behind (tab throttled, network
  // hiccup) reset rather than queueing ever-growing latency.
  if (nextT < now + 0.02 || nextT > now + 0.6) nextT = now + 0.10;
  src.start(nextT);
  nextT += ab.duration;
  frames++; lastFrame = performance.now();
}
// 48 kHz asked for up front so the context matches the TCI wire rate and
// nothing has to resample. A browser is free to refuse the hint and throw;
// take whatever rate it will give us rather than losing audio altogether.
// Browsers suspend an AudioContext that has been backgrounded, and iOS
// suspends one on any interruption -- a call, another app, the screen
// locking. Nothing resumes it by itself: frames keep arriving and get
// scheduled into a clock that is not running, so the page looks healthy and
// plays nothing. Resuming is free when it is already running.
function resumeCtx(){
  if (ctx && ctx.state !== "running") ctx.resume().catch(() => {});
}
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && S.audio) resumeCtx();
});
function makeCtx(){
  const AC = window.AudioContext || window.webkitAudioContext;
  try { return new AC({sampleRate:48000}); }
  catch (e){ log("48 kHz refused — using the default rate"); return new AC(); }
}
$("#audio").onclick = async () => {
  if (!S.audio){
    // iOS puts a bare AudioContext in the "ambient" audio session category,
    // and ambient is exactly what the ring/silent switch mutes. The failure
    // is invisible from in here: frames arrive, get scheduled, and play into
    // nothing. "playback" is the category streaming apps use and ignores the
    // switch. Safari 16.4+; absent elsewhere, so guard it.
    if (navigator.audioSession) navigator.audioSession.type = "playback";
    ctx = ctx || makeCtx();
    await ctx.resume();                          // needs a user gesture
    if (!gain){ gain = ctx.createGain(); gain.connect(ctx.destination); }
    gain.gain.value = 1;
    nextT = 0; frames = 0;
    send("audio_start:0"); send(`volume:${$("#vol").value}`);
    S.audio = true; $("#audio").textContent = "■ Audio"; $("#audio").classList.add("on");
    log("audio on");
  } else {
    send("audio_stop");
    S.audio = false; $("#audio").textContent = "▶ Audio"; $("#audio").classList.remove("on");
    $("#astat").textContent = "off"; log("audio off");
  }
};
// Transmit monitor. If the radio routes MON to LINE OUT, raising this makes
// your own transmitted audio audible in the RX stream during TX.
$("#mon").oninput = e => { $("#monv").textContent = e.target.value; };
$("#mon").onchange = e => send(`mon_volume:${e.target.value}`);
// TUNE at exactly 5 W or 50 W starts the K3's internal power calibration
// instead of a plain carrier. The bridge refuses it too, against the radio's
// own PC reading; this is the check that can say why.
const TUNE_BAD_W = [5, 50];
function showPwr(w){
  $("#pwrw").textContent = w + " W";
  const bad = TUNE_BAD_W.includes(+w);
  $("#pwrwarn").hidden = !bad;
  if (bad) $("#pwrwarn").textContent =
    `TUNE is blocked at exactly ${w} W (it triggers the K3's internal ` +
    `calibration). Go up or down 1 W.`;
}
$("#pwr").oninput = e => showPwr(e.target.value);
$("#pwr").onchange = e => send(`drive:0,${e.target.value}`);
$("#tune").onclick = () => {
  const w = +$("#pwr").value;
  if (TUNE_BAD_W.includes(w)) {
    showPwr(w);
    log(`tune refused at ${w} W -- go up or down 1 W`);
    return;
  }
  // Momentary: a carrier long enough for the ATU, then straight back to RX.
  send("tune:0,true"); log("tune");
  setTimeout(() => send("tune:0,false"), 2500);
};
$("#vol").oninput = e => {
  $("#voldb").textContent = e.target.value + " dB";
  send(`volume:${e.target.value}`);
};
setInterval(() => {
  // A stale meter is a stopped one: the poll runs at 5 Hz, so anything
  // older than a second means the bridge is not reporting -- transmitting
  // from another client, a radio that stopped answering, a socket that has
  // gone quiet without closing. Any of those, the bar is a leftover.
  if (!S.tx && S.meterSeen && performance.now() - S.meterSeen > 1200)
    clearMeter("—");
  // A socket that dies without closing -- Wi-Fi dropping, the Pi going
  // away -- delivers no close event, so the reconnect that handles an
  // ordinary drop never runs and the page sits on a dead connection
  // looking connected. Messages arrive constantly when anything is alive
  // (the S-meter alone is 5 Hz), so silence on the whole socket is the
  // signal. Closing it by hand is what puts the existing retry to work.
  // NOT WHILE TRANSMITTING, and this is the whole reason the guard is
  // spelled out rather than assumed: the S-meter poll is suppressed in TX
  // and the TX sensors only run when a client is feeding audio, so a plain
  // PTT hold or a long CW message is a legitimately silent socket. Closing
  // it there would be the worst possible moment -- the bridge unkeys a
  // client that disconnects, so the watchdog would cut the transmission it
  // was watching.
  const quiet = performance.now() - S.msgSeen;
  if (S.ready && !S.tx && S.msgSeen && quiet > 6000){
    log("no traffic for 6 s — reconnecting");
    // onclose does the retry; close() on a socket whose TCP is already
    // dead still fires it locally, which is the point of closing by hand.
    S.ready = false;
    if (ws) ws.close(); else connect();
  }
  if (!S.audio) return;
  const stale = performance.now() - lastFrame;
  $("#astat").textContent = stale < 500 ? `${frames} frames` : "stalled";
  if (ctx) $("#lat").textContent = `buffer ${Math.max(0,(nextT - ctx.currentTime)*1000|0)} ms`;
  // Subscribed, connected, and no audio for three seconds: ask again. The
  // bridge keeps subscribers in a set, so a duplicate costs nothing, and
  // this is the one failure the page can fix by itself.
  // The rate limit keeps its own clock. Pushing `lastFrame` forward would
  // have done it too, and would have cost the only indicator that says
  // audio is dead: `#astat` reads that same value, so asking again would
  // have quietly repainted "stalled" as though frames were arriving.
  if (S.ready && stale > 3000 && performance.now() - S.askedAudio > 3000){
    S.askedAudio = performance.now();
    resumeCtx(); nextT = 0;
    send("audio_start:0");
    log("audio stalled — re-subscribing");
  }
}, 500);

// ── PTT ───────────────────────────────────────────────────────────────────
// Hold to transmit. Release, pointer-cancel and page-hide all unkey: the
// bridge has a watchdog, but the UI should never be the reason it is needed.
const ptt = $("#ptt");
const key = on => send(`trx:0,${on ? "true" : "false"}`);

// Only ever unkey a transmission WE started.
//
// S.tx means "the radio is transmitting", not "this page is transmitting" --
// the bridge broadcasts state to every client, so S.tx goes true when
// anything keys, including WSJT-X on another machine. Releasing on S.tx cut
// other clients' transmissions short: a tab switch, or even the mouse
// leaving the PTT button, sent trx:0,false and dropped someone else's TX
// mid-over. pointerleave in particular fires with no button pressed at all.
let myPtt = false;
const release = () => { if (myPtt) { myPtt = false; key(false); } };
ptt.addEventListener("pointerdown", e => { e.preventDefault(); myPtt = true; key(true); });
["pointerup", "pointercancel", "pointerleave"].forEach(ev =>
  ptt.addEventListener(ev, release));
window.addEventListener("blur", release);
document.addEventListener("visibilitychange", () => { if (document.hidden) release(); });
function paintPtt(){
  ptt.classList.toggle("tx", S.tx);
  ptt.textContent = S.tx ? "● TRANSMITTING" : "PTT — HOLD";
  $("#txpanel").classList.toggle("live", S.tx);
  if (S.tx) clearMeter("TX");
  if (!S.tx){
    clearMeter("—");                            // until the next poll lands
    $("#txbar").style.width = "0";
    $("#alcbar").style.width = "0";
    $("#txstat").textContent = "idle";
    $("#alcval").textContent = "—";
    $("#alchint").textContent = "";
  }
}

// ── CW ────────────────────────────────────────────────────────────────────
// No microphone involved, which is the point: getUserMedia needs a secure
// context and this page is plain http on a LAN address. CW text goes over
// the same WebSocket as everything else.
const call = id => (document.getElementById(id).value || "").toUpperCase().trim();
// K3 prosign escapes inside KY text: ( = KN, + = AR, = = BT, % = AS, * = SK
const MACROS = [
  ["CQ",   () => `CQ CQ DE ${call("mycall")} ${call("mycall")} K`],
  ["Call", () => `${call("hiscall")} DE ${call("mycall")} K`],
  ["5NN",  () => `${call("hiscall")} 5NN 5NN =`],
  ["TU",   () => `TU DE ${call("mycall")} K`],
  ["AGN",  () => "AGN AGN"],
  ["73",   () => `73 = ${call("mycall")} *`],
  ["?",    () => "?"],
  ["QRZ",  () => `QRZ DE ${call("mycall")} K`],
];
const cwEl = $("#cwmacros");
MACROS.forEach(([label, fn]) => {
  const b = document.createElement("button");
  b.textContent = label;
  b.onclick = () => cwSend(fn());
  cwEl.appendChild(b);
});
function cwSend(text){
  text = (text || "").trim();
  if (!text) return;
  if (S.mode !== "CWL" && S.mode !== "CWU"){ log("not in CW — switch mode first"); return; }
  send(`cw_msg:${text}`);
  log("cw> " + text);
}
$("#cwsend").onclick = () => { cwSend($("#cwtext").value); $("#cwtext").value = ""; };
$("#cwtext").addEventListener("keydown", e => {
  if (e.key === "Enter"){ e.preventDefault(); $("#cwsend").click(); }
});
$("#cwstop").onclick = () => { send("cw_macros_stop"); log("cw stop"); };
$("#wpm").onchange = e => {
  const v = Math.max(8, Math.min(50, +e.target.value || 20));
  e.target.value = v; send(`cw_keyer_speed:${v},0`);
};
// remember the calls between sessions
["mycall","hiscall"].forEach(id => {
  const el = document.getElementById(id);
  el.value = localStorage.getItem(id) || "";
  el.oninput = () => localStorage.setItem(id, el.value.toUpperCase());
});
function paintCw(){
  const cw = (S.mode === "CWL" || S.mode === "CWU");
  $("#cwpanel").style.opacity = cw ? "1" : ".5";
  $("#cwhint").textContent = cw ? "" : "(switch to CWL/CWU to send)";
  $("#cwsend").disabled = !cw;
  cwEl.querySelectorAll("button").forEach(b => b.disabled = !cw);
}

drawFreq(); paintPtt(); paintFilters(); paintCw(); connect();
</script>
</body>
</html>
